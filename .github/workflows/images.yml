name: images

# Publication minimale des images dans ECR (phase 8, ADR 0028) et des paquets zip des Lambda
# dans le bucket des artefacts (phase 9, ADR 0032) : nos images construites ici,
# étiquetées par la version SemVer exacte du composant (version.txt, release-please) ; les images
# officielles tierces copiées telles quelles (même empreinte, étiquette exacte de l'éditeur).
# Les dépôts sont IMMUTABLE : une étiquette déjà publiée n'est jamais remplacée, elle est sautée.
# Signature, attestation et déploiement : phase 10 (deploy.yml).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-dev
  cancel-in-progress: false

jobs:
  publier:
    name: Publication (dev)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      COMPTE_AWS: ${{ vars.AWS_ACCOUNT_ID_DEV }}
      REGION_AWS: ${{ vars.AWS_REGION || 'ca-central-1' }}
    steps:
      - name: Compte amorcé
        run: |
          if [ -z "$COMPTE_AWS" ]; then
            echo "::error::Variable AWS_ACCOUNT_ID_DEV absente : amorçage du compte dev requis (infra/bootstrap)."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.COMPTE_AWS }}:role/bootstrap/gha-apply
          role-session-name: gha-images-${{ github.run_id }}
          aws-region: ${{ env.REGION_AWS }}

      - name: Connexion à ECR
        id: ecr
        run: |
          registre="${COMPTE_AWS}.dkr.ecr.${REGION_AWS}.amazonaws.com"
          aws ecr get-login-password --region "$REGION_AWS" | docker login --username AWS --password-stdin "$registre"
          echo "registre=$registre" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      # Nos images : <dépôt> <Dockerfile> <fichier de version>. Les migrations suivent provisoirement
      # la version du composant command (point ouvert de la phase 0 : composant release-please).
      - name: Images du dépôt
        env:
          REGISTRE: ${{ steps.ecr.outputs.registre }}
        run: |
          set -euo pipefail
          while read -r depot dockerfile version; do
            etiquette="$(tr -d '[:space:]' < "$version")"
            if aws ecr describe-images --repository-name "ledger/$depot" --image-ids imageTag="$etiquette" > /dev/null 2>&1; then
              echo "ledger/$depot:$etiquette déjà publiée : sautée."
              continue
            fi
            # --provenance=false : manifeste simple (Lambda refuse un index d'images).
            docker buildx build --provenance=false --platform linux/amd64 --push \
              -f "$dockerfile" -t "$REGISTRE/ledger/$depot:$etiquette" .
            echo "ledger/$depot:$etiquette publiée." >> "$GITHUB_STEP_SUMMARY"
          done <<'LISTE'
          command-api src/Command/Ledger.Command.Api/Dockerfile src/Command/version.txt
          query-api src/Query/Ledger.Query.Api/Dockerfile src/Query/version.txt
          projections-worker src/Projections/Ledger.Projections.Worker/Dockerfile src/Projections/version.txt
          migrations src/Tools/Ledger.Migrations/Dockerfile src/Command/version.txt
          pki-lambda src/Pki/Ledger.Pki.Lambda/Dockerfile src/Pki/version.txt
          pki-sentinelle src/Pki/Ledger.Pki.Sentinelle/Dockerfile src/Pki/version.txt
          LISTE

      # Paquets zip des Lambda à runtime géré (ADR 0032) : construits ici, déposés dans le bucket
      # des artefacts sous <composant>/<version>.zip. Le bucket refuse toute écriture sans
      # If-None-Match : une version publiée n'est jamais remplacée.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Paquets Lambda
        run: |
          set -euo pipefail
          bucket="ledger-dev-artefacts-${COMPTE_AWS}-${REGION_AWS}"
          while read -r composant projet version; do
            etiquette="$(tr -d '[:space:]' < "$version")"
            cle="$composant/$etiquette.zip"
            if aws s3api head-object --bucket "$bucket" --key "$cle" > /dev/null 2>&1; then
              echo "s3://$bucket/$cle déjà publié : sauté."
              continue
            fi
            sortie="$RUNNER_TEMP/$composant"
            dotnet publish "$projet" -c Release -r linux-x64 --self-contained false -o "$sortie"
            (cd "$sortie" && zip -qr -X "$RUNNER_TEMP/$composant.zip" .)
            aws s3api put-object --bucket "$bucket" --key "$cle" --body "$RUNNER_TEMP/$composant.zip" --if-none-match '*' > /dev/null
            echo "s3://$bucket/$cle publié." >> "$GITHUB_STEP_SUMMARY"
          done <<'LISTE'
          authorizer src/Authorizer/Ledger.Authorizer/Ledger.Authorizer.csproj src/Authorizer/version.txt
          LISTE

      # Copies des images officielles (aucune sortie Internet depuis le VPC, ADR 0023) : même
      # version que celle déclarée dans versions_images (infra/envs/*/variables.tf).
      - name: Images officielles tierces
        env:
          REGISTRE: ${{ steps.ecr.outputs.registre }}
        run: |
          set -euo pipefail
          while read -r depot source etiquette; do
            if aws ecr describe-images --repository-name "ledger/$depot" --image-ids imageTag="$etiquette" > /dev/null 2>&1; then
              echo "ledger/$depot:$etiquette déjà copiée : sautée."
              continue
            fi
            docker buildx imagetools create --tag "$REGISTRE/ledger/$depot:$etiquette" "$source:$etiquette"
            echo "ledger/$depot:$etiquette copiée depuis $source." >> "$GITHUB_STEP_SUMMARY"
          done <<'LISTE'
          kafka docker.io/apache/kafka 4.3.2
          debezium-connect quay.io/debezium/connect 3.7.0.Final
          keycloak quay.io/keycloak/keycloak 26.8.1
          aws-otel-collector public.ecr.aws/aws-observability/aws-otel-collector v0.50.0
          LISTE
