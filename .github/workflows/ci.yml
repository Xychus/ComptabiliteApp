name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-unit-tests:
    name: Build et tests sans Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Ledger.slnx
      - name: Build
        run: dotnet build Ledger.slnx --no-restore -c Release -warnaserror
      # Le build régénère docs/api/openapi.json (ADR 0014) : un écart = contrat modifié sans être versionné.
      - name: Contrat OpenAPI à jour
        run: git diff --exit-code -- docs/api
      - name: Tests (hors intégration)
        run: >
          dotnet test --solution Ledger.slnx --no-build -c Release
          --filter-not-trait "Category=Integration"
          --coverage --coverage-output-format cobertura
          --coverage-settings "$GITHUB_WORKSPACE/coverage.config"
          --results-directory "$GITHUB_WORKSPACE/TestResults/unit"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-unit
          path: TestResults/unit/**/*.cobertura.xml
          if-no-files-found: warn

  integration-tests:
    name: Tests d'intégration (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Docker disponible
        run: docker info --format '{{.ServerVersion}}'
      - name: Build
        run: dotnet build Ledger.slnx -c Release -warnaserror
      - name: Tests d'intégration
        run: >
          dotnet test --solution Ledger.slnx --no-build -c Release
          --filter-trait "Category=Integration"
          --coverage --coverage-output-format cobertura
          --coverage-settings "$GITHUB_WORKSPACE/coverage.config"
          --results-directory "$GITHUB_WORKSPACE/TestResults/integration"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-integration
          path: TestResults/integration/**/*.cobertura.xml
          if-no-files-found: warn

  docker-image:
    name: Image de l'API de commandes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Construction seule (aucune publication) : la publication versionnée arrive en phase 10.
      - name: Build de l'image
        run: docker build -f src/Command/Ledger.Command.Api/Dockerfile -t ledger-command-api:ci-${{ github.sha }} .
      - name: Démarrage non root, système de fichiers en lecture seule
        run: |
          docker run -d --name api --read-only --cap-drop ALL --security-opt no-new-privileges -p 8080:8080 \
            -e Ledger__Authentication__Authority=https://keycloak.example/realms/ledger \
            -e "ConnectionStrings__Ledger=Host=127.0.0.1;Port=1;Database=ledger;Username=ledger_app" \
            ledger-command-api:ci-${{ github.sha }}
          for i in $(seq 1 30); do curl -fs http://localhost:8080/health/live && break; sleep 1; done
          curl -fs http://localhost:8080/health/live
          test "$(docker inspect api --format '{{.Config.User}}')" = "1654"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT http://localhost:8080/v1/journal-entries/0199f0a0-0000-7000-8000-000000000001)" = "401"
      - name: Journaux du conteneur
        if: always()
        run: docker logs api || true

  coverage:
    name: Seuils de couverture
    needs: [build-and-unit-tests, integration-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: TestResults
      - name: Fusion des rapports
        run: |
          dotnet tool restore
          dotnet tool run reportgenerator \
            "-reports:TestResults/**/*.cobertura.xml" \
            "-targetdir:coverage" \
            "-reporttypes:Cobertura;MarkdownSummaryGithub"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - name: Seuils (Domain >= 90 %, reste >= 75 %)
        shell: pwsh
        run: ./eng/Check-Coverage.ps1 -Report coverage/Cobertura.xml

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-and-quality
      - name: Build
        run: dotnet build Ledger.slnx -c Release
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
