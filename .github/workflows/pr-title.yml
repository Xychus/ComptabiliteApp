name: pr-title

# Le titre de PR devient le message du commit fusionné (squash) : il doit respecter
# Conventional Commits pour que release-please calcule les versions (ADR 0001).
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-commits:
    name: Titre de PR en Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            test
            docs
            build
            ci
            chore
            revert
          scopes: |
            command
            projections
            query
            authorizer
            contracts
            infra
            shared-kernel
            migrations
            integrity
            deps
            ci
            docs
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            Le sujet « {subject} » doit commencer par une minuscule.
