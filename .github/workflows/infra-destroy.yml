name: infra-destroy

# Destruction de l'environnement dev, jetable (ADR 0027) : à la demande seulement, après saisie du
# nom de l'environnement. Même rôle (gha-apply), même environnement GitHub « dev » et même file
# d'attente qu'infra-apply.yml : une destruction et un apply ne se chevauchent jamais.
# Recréer dev : lancer infra-apply.yml (workflow_dispatch). Prod n'est jamais concernée.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Saisir « ledger-dev » pour confirmer la destruction de l'environnement dev"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: infra-apply-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugins

jobs:
  destroy:
    name: Destroy (dev)
    if: inputs.confirmation == 'ledger-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      COMPTE_AWS: ${{ vars.AWS_ACCOUNT_ID_DEV }}
      REGION_AWS: ${{ vars.AWS_REGION || 'ca-central-1' }}
      REPERTOIRE: infra/envs/dev
      TF_VAR_compte_aws: ${{ vars.AWS_ACCOUNT_ID_DEV }}
      TF_VAR_region: ${{ vars.AWS_REGION || 'ca-central-1' }}
    steps:
      - name: Compte amorcé
        run: |
          if [ -z "$COMPTE_AWS" ]; then
            echo "::error::Variable AWS_ACCOUNT_ID_DEV absente."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Version de Terraform
        id: version
        run: echo "terraform=$(cat infra/.terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.version.outputs.terraform }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.COMPTE_AWS }}:role/bootstrap/gha-apply
          role-session-name: gha-destroy-${{ github.run_id }}
          aws-region: ${{ env.REGION_AWS }}

      - name: Init
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform -chdir="$REPERTOIRE" init -lockfile=readonly -no-color \
            -backend-config="bucket=ledger-tfstate-${COMPTE_AWS}-${REGION_AWS}" \
            -backend-config="region=${REGION_AWS}" \
            -backend-config="kms_key_id=arn:aws:kms:${REGION_AWS}:${COMPTE_AWS}:alias/ledger-tfstate"

      # Arrêter avant de détruire quoi que ce soit si la destruction ne peut pas aller au bout :
      # un objet verrouillé (COMPLIANCE) rend le bucket d'archive indestructible pendant 6 ans.
      - name: Vérifications préalables
        run: |
          sorties=$(terraform -chdir="$REPERTOIRE" output -json)
          bucket=$(echo "$sorties" | jq -r '.bucket_archive.value // empty')
          if [ -n "$bucket" ]; then
            versions=$(aws s3api list-object-versions --bucket "$bucket" --max-items 1 --output json \
              | jq '((.Versions // []) + (.DeleteMarkers // [])) | length')
            if [ "$versions" -ne 0 ]; then
              echo "::error::Le bucket d'archive $bucket contient des objets verrouillés (COMPLIANCE) : destruction impossible."
              exit 1
            fi
          fi
          grappe=$(echo "$sorties" | jq -r '.aurora.value.identifiant // empty')
          if [ -n "$grappe" ]; then
            protection=$(aws rds describe-db-clusters --db-cluster-identifier "$grappe" \
              --query 'DBClusters[0].DeletionProtection' --output text)
            if [ "$protection" != "False" ]; then
              echo "::error::La grappe $grappe est protégée contre la suppression : appliquer d'abord la configuration courante (infra-apply.yml)."
              exit 1
            fi
          fi

      - name: Plan de destruction
        run: |
          terraform -chdir="$REPERTOIRE" plan -destroy -no-color -lock-timeout=5m -out=destruction.tfplan
          {
            echo "### Terraform destroy — \`dev\`"
            echo
            echo '```'
            terraform -chdir="$REPERTOIRE" show -no-color destruction.tfplan | grep -E '^(Plan:|No changes\.)' || echo "(aucun résumé)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Destroy
        run: terraform -chdir="$REPERTOIRE" apply -no-color -lock-timeout=5m destruction.tfplan

  confirmation-invalide:
    name: Confirmation invalide
    if: inputs.confirmation != 'ledger-dev'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Confirmation invalide : saisir exactement « ledger-dev »."
          exit 1
