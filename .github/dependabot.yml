version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      tests:
        patterns: ["xunit*", "Microsoft.Testing.*", "TngTech.ArchUnitNET*", "FsCheck*", "Testcontainers*"]
      microsoft:
        patterns: ["Microsoft.*", "System.*"]

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  # Les répertoires Terraform et les Dockerfile arrivent aux phases 3 et 6.
  - package-ecosystem: terraform
    directories: ["/infra/**"]
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directories: ["/src/**"]
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
